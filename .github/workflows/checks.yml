name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: python -m pip install -r Bridge/requirements.txt
      - run: python Bridge/test_bridge.py
      - run: npm ci
        working-directory: Web
      - run: npm test
        working-directory: Web
      - run: npm run build
        working-directory: Web
