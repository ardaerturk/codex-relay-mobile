name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: python -m pip install -r Bridge/requirements.txt
      - run: python Bridge/test_bridge.py
      - run: npm ci
        working-directory: Web
      - run: npm test
        working-directory: Web
      - run: npm run build
        working-directory: Web
  native-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native macOS app
        run: Scripts/build-macos.sh
      - name: Check iOS source compatibility
        run: xcrun swiftc -typecheck -swift-version 5 -target arm64-apple-ios18.0 -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" Relay/RelayApp.swift Relay/Core/*.swift Relay/Views/*.swift
      - name: Verify native Keychain persistence
        run: |
          xcrun swiftc -parse-as-library Relay/Core/Models.swift Relay/Core/Keychain.swift Tests/KeychainChecks.swift -o "$RUNNER_TEMP/keychain-checks"
          test_account="$(uuidgen)"
          trap '"$RUNNER_TEMP/keychain-checks" delete "$test_account"' EXIT
          "$RUNNER_TEMP/keychain-checks" write "$test_account"
          "$RUNNER_TEMP/keychain-checks" read "$test_account"
